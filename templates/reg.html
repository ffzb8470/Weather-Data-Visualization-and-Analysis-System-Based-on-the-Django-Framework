<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 空气质量分析系统</title>
{% load static %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css">
        <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>
    <div class="auth-card">
        <div class="logo"><i class="fas fa-leaf"></i></div>
        <h2>创建账号</h2>
        <p class="subtitle">注册空气质量分析系统</p>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="post" action="/reg/">
            {% csrf_token %}
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="user" placeholder="请设置用户名" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="pwd" placeholder="请设置密码" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn-auth">注 册</button>
        </form>

        <div class="auth-footer">
            已有账号？<a href="/login/">立即登录</a>
        </div>
    </div>
</body>
</html>
